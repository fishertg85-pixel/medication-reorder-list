AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  NorTex Reorder List (cloud). Website (S3 + CloudFront), logins (Cognito), API (API Gateway + Lambda),
  data (DynamoDB). The two data tables are kept even if this stack is deleted, have deletion protection
  and 35-day point-in-time recovery. The app has no permission to delete archived orders.

Parameters:
  AppName:
    Type: String
    Default: nortex-reorder
    AllowedPattern: '[a-z][a-z0-9-]{2,30}'
    Description: Short lowercase name used in resource names.
  TextCodes:
    Type: String
    Default: 'on'
    AllowedValues: ['on', 'off']
    Description: Texted sign-in codes. 'off' signs in with password only (while SMS isn't approved yet). deploy.sh keeps the last choice.

Conditions:
  TextCodesOn: !Equals [!Ref TextCodes, 'on']

Resources:
  # ------------------------------------------------------------------ data
  MainTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AppName}-main'
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  ArchiveTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AppName}-archive'
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  # ------------------------------------------------------------------ logins
  # Cognito sends sign-in codes by text message through Amazon SNS using this role
  SmsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cognito-idp.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'sts:ExternalId': !Sub '${AppName}-sms' }
      Policies:
        - PolicyName: sms
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: '*'

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AppName}-users'
      # sign-in with a login ID (not email); IDs are not case-sensitive
      UsernameConfiguration: { CaseSensitive: false }
      DeletionProtection: ACTIVE
      MfaConfiguration: !If [TextCodesOn, 'ON', 'OFF']
      EnabledMfas: !If [TextCodesOn, [SMS_MFA], !Ref AWS::NoValue]
      SmsConfiguration:
        SnsCallerArn: !GetAtt SmsRole.Arn
        ExternalId: !Sub '${AppName}-sms'
        SnsRegion: !Ref AWS::Region
      SmsAuthenticationMessage: 'IronLedger: Your NorTex Reorder sign-in code is {####}. Do not share this code. Reply STOP to opt out.'
      SmsVerificationMessage: 'IronLedger: Your NorTex Reorder verification code is {####}. Do not share this code. Reply STOP to opt out.'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          SMSMessage: 'NorTex Reorder login {username}, temporary password {####}'
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
      # passwords are reset only by the Account Owner (a texted code alone must not replace the password)
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: admin_only, Priority: 1 }
      Schema:
        - { Name: phone_number, AttributeDataType: String, Required: false, Mutable: true }
        - { Name: name, AttributeDataType: String, Required: false, Mutable: true }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AppName}-web'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      # people can't change their own sign-in phone number; only the Account Owner can (through the app)
      WriteAttributes: [name]
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: hours, IdToken: hours, RefreshToken: days }

  # ------------------------------------------------------------------ API
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: data
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:BatchGetItem]
                Resource: !GetAtt MainTable.Arn
              # archive: add and read only. No DeleteItem, no BatchWriteItem: archived orders can't be removed by the app.
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query]
                Resource: !GetAtt ArchiveTable.Arn
              - Effect: Allow
                Action: [cognito-idp:AdminCreateUser, cognito-idp:AdminGetUser, cognito-idp:AdminDisableUser,
                         cognito-idp:AdminEnableUser, cognito-idp:AdminUpdateUserAttributes, cognito-idp:AdminSetUserPassword,
                         cognito-idp:AdminSetUserMFAPreference, cognito-idp:AdminUserGlobalSignOut, cognito-idp:ListUsers,
                         cognito-idp:AdminDeleteUser]
                Resource: !GetAtt UserPool.Arn
              # documents: put and read only (the links the app hands out are signed with these rights). No delete: a stored file can't be removed by the app.
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${DocsBucket.Arn}/*'
              # the secret that keys the PIN hashes: read only
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Ref PinSecret

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-api'
      Runtime: nodejs22.x
      Handler: index.handler
      Code: ./lambda
      MemorySize: 512
      Timeout: 29
      Role: !GetAtt ApiRole.Arn
      Environment:
        Variables:
          MAIN_TABLE: !Ref MainTable
          SUITE_USERS: 'NTX1:tfisher85,mferreiro,eoviedo,mamare'   # Calendar + Documents: only these logins, at this pharmacy ID (STORE:login,login;STORE2:...)
          ARCHIVE_TABLE: !Ref ArchiveTable
          USER_POOL_ID: !Ref UserPool
          DOCS_BUCKET: !Ref DocsBucket
          PIN_SECRET_ARN: !Ref PinSecret

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AppName}-api'
      RetentionInDays: 90

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AppName}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Sub 'https://${Distribution.DomainName}']
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
        Audience: [!Ref UserPoolClient]

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'

  ApiRouteGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiRoutePost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ApiIntegration}'

  # sign-in screen: pharmacy name + logo for a typed Pharmacy ID (no login needed, nothing else exposed)
  ApiRoutePublic:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /public/pharmacy/{id}'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  # ------------------------------------------------------------------ website
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  # private bucket for each pharmacy's compliance documents (PDFs). Never public; people get a short-lived link per file from the API.
  # Versioning keeps every earlier copy of a file. Retained if the stack is ever deleted.
  # Keys the hashes of staff PINs. Retained if the stack is ever replaced: losing it would invalidate every PIN (each person would need a temporary one).
  PinSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Keys the hashes of staff PINs (signing approvals and reviews)
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  DocsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Sub 'https://${Distribution.DomainName}']
            AllowedMethods: [GET, PUT, HEAD]
            AllowedHeaders: ['*']
            MaxAge: 3600

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AppName}-oac-${AWS::Region}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: NorTex Reorder List
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized (honours Cache-Control)
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  SiteUrl:        { Value: !Sub 'https://${Distribution.DomainName}' }
  ApiUrl:         { Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com' }
  UserPoolId:     { Value: !Ref UserPool }
  ClientId:       { Value: !Ref UserPoolClient }
  SiteBucketName: { Value: !Ref SiteBucket }
  DocsBucketName: { Value: !Ref DocsBucket }
  DistributionId: { Value: !Ref Distribution }
  FunctionName:   { Value: !Ref ApiFunction }
  MainTableName:    { Value: !Ref MainTable }
  ArchiveTableName: { Value: !Ref ArchiveTable }
