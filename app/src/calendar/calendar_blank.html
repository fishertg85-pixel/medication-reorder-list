<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IronLedger Compliance Calendar (New Pharmacy)</title>
<style>:root{

  color-scheme:light;
}

  --bg:#10161c;--panel:#18212a;--ink:#e5eaef;--mut:#9aa9b8;--line:#2a3845;--soft:#212d38;
  --accent:#74aedb;--accent-ink:#0c141b;--accent-soft:#1d3447;
  --bad:#ff9a92;--bad-bg:#3b1a18;--warn:#f2c46b;--warn-bg:#3a2d0f;--ok:#7fd3a0;--ok-bg:#15301f;--gray:#a9b6c3;--gray-bg:#25313c;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10161c;--panel:#18212a;--ink:#e5eaef;--mut:#9aa9b8;--line:#2a3845;--soft:#212d38;
  --accent:#74aedb;--accent-ink:#0c141b;--accent-soft:#1d3447;
  --bad:#ff9a92;--bad-bg:#3b1a18;--warn:#f2c46b;--warn-bg:#3a2d0f;--ok:#7fd3a0;--ok-bg:#15301f;--gray:#a9b6c3;--gray-bg:#25313c;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header.top{background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.mark{font-weight:700;font-size:18px;letter-spacing:.2px}.mark b{color:var(--accent)}
.brand small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.spacer{flex:1}

textarea{width:100%;min-height:64px;resize:vertical}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-top:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--mut);white-space:nowrap;font-weight:500}

main{padding:16px 0 40px;min-height:60vh}

.banner.demo{background:var(--warn-bg);color:var(--warn)}.banner.info{background:var(--accent-soft);color:var(--ink)}.banner.bad{background:var(--bad-bg);color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;border-left:4px solid var(--line);cursor:default}
.tile .n{font:600 28px/1.1 var(--mono);font-variant-numeric:tabular-nums}.tile .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.tile.bad{border-left-color:var(--bad)}.tile.warn{border-left-color:#d99a1c}.tile.ok{border-left-color:var(--ok)}.tile.acc{border-left-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
.card>h2,.card>.hd{margin:0;padding:12px 14px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .hd h2{margin:0;font-size:15px}
.card .body{padding:12px 14px}
.hd .sub{color:var(--mut);font-weight:400;font-size:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}

td{padding:7px 10px;border-bottom:1px solid var(--soft);white-space:nowrap;max-width:250px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}

tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.p-overdue{background:var(--bad-bg);color:var(--bad)}.p-due-soon{background:var(--warn-bg);color:var(--warn)}.p-upcoming{background:var(--accent-soft);color:var(--accent)}
.p-done{background:var(--ok-bg);color:var(--ok)}.p-late-done{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}.p-na{background:var(--gray-bg);color:var(--gray)}
.p-nobaseline{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}.p-projected{background:transparent;color:var(--mut);border:1px dashed var(--line)}
.p-High{background:var(--ok-bg);color:var(--ok)}.p-Moderate{background:var(--warn-bg);color:var(--warn)}.p-Low{background:var(--bad-bg);color:var(--bad)}.p-Internal{background:var(--gray-bg);color:var(--gray)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer;white-space:nowrap;min-height:30px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:2px 9px;min-height:26px;font-size:13px}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{padding:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft)}
.cal .day{min-height:104px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden;min-width:0}
.cal .day.out{background:var(--soft);opacity:.65}.cal .day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal .day .d{font:12px var(--mono);color:var(--mut);display:flex;justify-content:space-between}
.cal .day.today .d b{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px}
.chip{display:block;font-size:11.5px;padding:1px 6px;border-radius:4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--mut);margin-top:2px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,18,26,.55);display:flex;align-items:flex-start;justify-content:center;padding:32px 12px;overflow:auto;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:100%;max-width:640px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal.wide{max-width:900px}
.modal h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:16px}
.modal .mb{padding:14px 16px;display:grid;gap:12px}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fld{display:grid;gap:4px}.fld>label,.lbl{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.fld .hint{font-size:12px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;gap:6px 16px;flex-wrap:wrap}.checks label{display:flex;gap:6px;align-items:center;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.warnbox{background:var(--warn-bg);color:var(--warn);padding:8px 10px;border-radius:6px;font-size:13px}
.err{color:var(--bad);font-size:13px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:13px}.kv dt{color:var(--mut)}.kv dd{margin:0}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:90;font-size:13px}
.sq{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:2px;vertical-align:middle}
.sq.d{background:var(--ok)}.sq.m{background:var(--bad)}.sq.f{background:var(--line)}
footer.foot{border-top:1px solid var(--line);padding:16px 0;color:var(--mut);font-size:12px;display:flex;gap:8px;align-items:baseline}
footer.foot b{color:var(--ink)}
@media (max-width:700px){.g2{grid-template-columns:1fr}.cal .day{min-height:70px}.chip{font-size:10.5px}.kv{grid-template-columns:1fr}}

/* calendar additions */
.btn-grp{display:inline-flex;gap:4px}
.clock{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;white-space:nowrap;font-size:13px}
.clock:hover{background:var(--accent-soft)}
.clock .num{font-weight:600;font-size:14px}
.navbar{margin-bottom:6px}
.cal .dow.wk{background:var(--line)}
.cal .day.wk{background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(120,140,160,.07) 8px 16px)}
.cal .day.cls{background:repeating-linear-gradient(135deg,rgba(120,140,160,.10) 0 6px,rgba(120,140,160,.03) 6px 12px)}
.sw{display:inline-block;width:14px;height:14px;border:1px solid var(--line);border-radius:3px;vertical-align:middle;margin:0 4px 0 8px}
.sw.wk{background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(120,140,160,.25) 4px 8px)}
.sw.cls{background:rgba(120,140,160,.35)}
.hl{font-size:11px;padding:0 5px;border-radius:3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl.hol{background:#efe6fb;color:#5b2a91}.hl.closed{background:var(--warn-bg);color:var(--warn);font-weight:600}.hl.obs2{background:var(--soft);color:var(--mut)}.hl.leap{background:var(--ok-bg);color:var(--ok)}.hl.dst{background:var(--warn-bg);color:var(--warn)}

.chip.plan{background:transparent;border:1px dashed var(--accent);color:var(--ink)}
.dayhead{display:flex;gap:16px;align-items:flex-start}
.tl{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tlr{display:grid;grid-template-columns:76px 1fr;min-height:30px;border-bottom:1px solid var(--soft)}
.tlr:last-child{border-bottom:0}
.tlh{padding:5px 8px;font:12px var(--mono);color:var(--mut);border-right:1px solid var(--line);background:var(--soft)}
.tlr.shut .tlb{background:repeating-linear-gradient(135deg,rgba(120,140,160,.12) 0 6px,rgba(120,140,160,.04) 6px 12px)}
.tlr.open .tlb{background:var(--panel)}
.tlr.nowrow .tlh{background:var(--accent);color:var(--accent-ink)}
.tlb{padding:3px 8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nowtag{font-size:11px;color:var(--accent);font-weight:600}

.cal .day.pre{background:var(--soft);cursor:not-allowed;opacity:.35}
.btn:disabled{opacity:.4;cursor:not-allowed}

.calwrap{display:flex;align-items:flex-start}.calmain{flex:1;min-width:0}

.sec{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
.cmts{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}.cmt{padding:6px 8px;background:var(--soft);border-radius:6px}
.att{display:flex;gap:10px;align-items:center;padding:4px 0}.att a{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.att .mut{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;text-align:center}
.sr .tx .pl{display:block;margin-top:3px}
.dayside{width:380px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ===== full-width calendar, fits the screen ===== */
.wrap{max-width:1680px}
.wrap.wide{max-width:none;padding:0 20px}
.calbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px;padding-bottom:4px}

.cal .day{min-height:clamp(80px,calc((100vh - 440px)/6),200px)}

.modal.xwide{max-width:1240px}

.serc{min-height:90px;padding:4px;border-right:1px solid var(--line);min-width:0}.serc:last-child{border-right:0}.serc.now{background:var(--accent-soft)}
.serh{font:600 12px var(--sans);color:var(--mut);margin-bottom:4px}

.chip.plan.rem{border-style:dotted;font-style:italic}

<script>
window.IL_BLANK=true;
/* IronLedger Compliance Calendar - scheduling engine (pure functions, no DOM). */
const IL = (function () {
  'use strict';
  const DAY = 86400000;
  const pad = n => String(n).padStart(2, '0');
  function pd(s) { const p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function fd(ms) { const t = new Date(ms); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate()); }
  function addDays(s, n) { return fd(pd(s) + n * DAY); }
  function diffDays(a, b) { return Math.round((pd(a) - pd(b)) / DAY); }
  function addMonths(s, n, day) {
    const p = s.split('-').map(Number); const tm = p[1] - 1 + n;
    const y = p[0] + Math.floor(tm / 12); const m = ((tm % 12) + 12) % 12;
    const dim = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    return y + '-' + pad(m + 1) + '-' + pad(Math.min(day || p[2], dim));
  }
  function addInterval(s, n, unit, day) {
    if (unit === 'day') return addDays(s, n);
    if (unit === 'week') return addDays(s, 7 * n);
    if (unit === 'month') return addMonths(s, n, day);
    if (unit === 'year') return addMonths(s, 12 * n, day);
    throw new Error('Unknown unit ' + unit);
  }
  function statusFor(due, today, lead) { const d = diffDays(due, today); return d < 0 ? 'overdue' : (d <= lead ? 'due-soon' : 'upcoming'); }
  function mkOpen(due, today, lead, extra) { return Object.assign({ due, status: statusFor(due, today, lead), days: diffDays(due, today), done: false }, extra); }
  function mkDone(due, rec, extra) {
    const eff = (rec.allowedDue && rec.allowedDue > due) ? rec.allowedDue : due;
    const late = !!(due && rec.completedOn > eff);
    return Object.assign({ due, status: rec.status === 'na' ? 'na' : (late ? 'late-done' : 'done'), done: true, rec, lateDays: late ? diffDays(rec.completedOn, eff) : 0, days: due ? diffDays(due, rec.completedOn) : null }, extra);
  }

  /* One track = one obligation for one subject. Returns its occurrences in due order. */
  function trackOccurrences(a) {
    const ob = a.ob, r = ob.rec, trk = a.trk || {}, today = a.today;
    const lead = trk.lead != null ? trk.lead : (ob.lead || 0);
    const horizon = a.to;
    const recs = (a.recs || []).filter(x => x.status !== 'void')
      .sort((x, y) => x.completedOn < y.completedOn ? -1 : x.completedOn > y.completedOn ? 1 : ((x.createdAt || '') < (y.createdAt || '') ? -1 : 1));
    const out = [];
    if (r.kind === 'rolling') {
      const n = trk.n || r.n, unit = trk.unit || r.unit;
      let prev = null; const base = trk.baselineDate || null;
      const real = recs.filter(x => x.status !== 'na');
      if (base && (!real.length || base <= real[0].completedOn)) prev = base;
      for (const rec of real) {
        const due = prev ? addInterval(prev, n, unit) : (trk.firstDue || null);
        out.push(mkDone(due, rec, { key: 'r:' + rec.id, windowStart: prev }));
        prev = rec.completedOn;
      }
      const due = prev ? addInterval(prev, n, unit) : (trk.firstDue || null);
      if (!due) out.push({ key: 'r:open', due: null, status: 'nobaseline', done: false, days: null });
      else {
        out.push(mkOpen(due, today, lead, { key: 'r:open:' + due, windowStart: prev }));
        let d = due, g = 0;
        while (g++ < 400) { d = addInterval(d, n, unit); if (d > horizon) break; out.push({ key: 'p:' + d, due: d, status: 'projected', projected: true, done: false, days: diffDays(d, today) }); }
      }
    } else if (r.kind === 'expiry') {
      let due = trk.firstDue || null;
      for (const rec of recs) { if (rec.status === 'na') continue; out.push(mkDone(due, rec, { key: 'e:' + rec.id })); due = rec.nextDue || null; }
      if (!due) out.push({ key: 'e:open', due: null, status: 'nobaseline', done: false, days: null });
      else {
        const o = mkOpen(due, today, lead, { key: 'e:open:' + due });
        o.openDate = addDays(due, -(r.windowDays || 0)); o.canAct = r.windowDays ? today >= o.openDate : true; out.push(o);
      }
    } else if (r.kind === 'fixed') {
      const n = trk.n || r.n, unit = trk.unit || r.unit;
      const anchor = trk.anchor || r.anchor || today; const aday = +anchor.slice(8);
      const sf = trk.startFrom || r.startFrom; const start = (sf && sf > (a.trackStart || today)) ? sf : (a.trackStart || today);
      const dueAt = k => addInterval(anchor, k * n, unit, aday);
      let k;

      ['presidents', "Washington's Birthday (Presidents Day)", ds(y, 2, nth(y, 2, 1, 3))],

/* ===== calendar facts: hours, holidays, clock ===== */
const DOWN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const toMin=t=>{ const p=String(t).split(':'); return (+p[0])*60+(+p[1]||0); };
function t12(min){ min=Math.min(min,1440); let h=Math.floor(min/60)%24, m=min%60; const ap=(min>=720&&min<1440)?'PM':'AM'; const hh=h%12===0?12:h%12; return hh+':'+String(m).padStart(2,'0')+' '+ap; }
const dowOfDate=d=>new Date(d+'T00:00:00Z').getUTCDay();
function nowIn(tz){
  const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short',timeZoneName:'short'}); const p={}; f.formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
  return {date:p.year+'-'+p.month+'-'+p.day,min:(+p.hour%24)*60+(+p.minute),s:+p.second,abbr:p.timeZoneName,dow:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday),hh:+p.hour%24,mm:p.minute};
}
/* Hours for a date, honoring weekly hours and holiday closures. Returns {closed,reason} or {closed:false,o,c,text} */
/* Closed days the pharmacy sets on its account page (the Account Owner): dated days (one year or every year). Read live from the host, so a change shows
   for everyone who opens the calendar without anyone re-saving it. Returns the day's name, or null. */
// Federal holidays the pharmacy is closed on: from the pharmacy record when the suite provides it (set on the pharmacy page), else the calendar's own list.
const holClosedIds=()=>{ const h=window.ILHOST&&ILHOST.pharmacy&&ILHOST.pharmacy.holClosed; if(Array.isArray(h)){ const o={}; h.forEach(i=>o[i]=true); return o; } return S.profile.holClosed||{}; };
function pharmClosure(date){
  const c=window.ILHOST&&ILHOST.pharmacy&&ILHOST.pharmacy.closures; if(!c)return null;
  const md=date.slice(5);
  for(const x of (c.days||[])) if(x.d===date||(x.y&&x.d.slice(5)===md))return x.n;
  return null;
}
function hoursFor(date){
  const p=S.profile;
  const cz=pharmClosure(date); if(cz)return {closed:true,reason:cz};
  for(const it of US.day(date,{tz:p.tz,hol:true,obs:false})){ if((it.kind==='hol'||(it.kind==='obs'&&it.mon))&&holClosedIds()[it.hid])return {closed:true,reason:it.name.replace(' (Observed)','')+(it.kind==='obs'?' (Observed)':'')}; }
  const h=p.hours[dowOfDate(date)]; if(!h)return {closed:true,reason:DOWN[dowOfDate(date)]+' Is A Regular Day Off'};
  const o=toMin(h.o), c=toMin(h.c);
  return {closed:false,o,c,text:(o===0&&c>=1440)?'Open 24 Hours':t12(o)+' to '+t12(c)};
}
let ADJ={};
function adjustDue(d){
  if(ADJ[d]!==undefined)return ADJ[d]; let r=d;
  if(hoursFor(d).closed){ const dir=S.profile.shift==='prev'?-1:1, t0=localToday(); let f=null,x=d;
    for(let g=0;g<21;g++){ x=IL.addDays(x,dir); if(!hoursFor(x).closed){ f=x; break; } }
    if(f&&dir<0&&(f<t0||f<(S.profile.launchedAt||''))&&d>=t0){ f=null; x=d; for(let g=0;g<21;g++){ x=IL.addDays(x,1); if(!hoursFor(x).closed){ f=x; break; } } }
    if(f)r=f; }
  ADJ[d]=r; return r;

function roomModal(id,kind0){
  const cur=id?S.rooms.find(x=>x.id===id):null; const f=S.profile.features; const sites=S.sites.filter(s=>!s.archived);
  const v=cur||{kind:kind0||(f.sterile?'buffer':'nsa'),iso:'7',num:'',neg:false,name:'',note:''};
  const kinds=[]; if(f.sterile)kinds.push('ante','buffer','sca'); if(f.nonsterile)kinds.push('nsa'); if(!kinds.includes(v.kind))kinds.push(v.kind);
  openModal(cur?'Edit Room Or Area':'Add Room Or Area','<p class="mut" style="margin:0 0 8px">Sterile rooms get their own certification schedule. Nonsterile areas do not.</p>'+fld('Type',sel('rk',kinds.map(k=>[k,ROOM_KINDS[k]]),v.kind))+
   '<div id="blkNum">'+fld('Room Number (Optional)',inp('rn',v.num,'text','1'),'Use 1, 2 And So On When There Is More Than One Room Of The Same Type.')+'</div>'+
   '<div id="blkNs">'+fld('Area Name',inp('rnm',v.kind==='nsa'?v.name:'','text','Example: Nonsterile Compounding Bench'))+fld('Location (Optional)',inp('rnt',v.note||'','text','Example: Back Counter, Left Of The Sink'))+'</div>'+
   (sites.length>1?fld('Pharmacy',sel('rs',sites.map(s=>[s.id,s.name]),v.siteId||sites[0].id)):'')+
   '<div id="blkAnte">'+bool('rneg',v.neg,'Next To Or Shared With A Negative Pressure Room')+'</div><div id="blkIso">'+fld('ISO Class','<select id="f_ri"></select>')+'</div><div id="roomNote" class="banner info" style="margin:0"></div>',
   (cur?'<button class="btn danger" data-act="archive" data-k="room" data-id="'+esc(id)+'" style="margin-right:auto">Archive</button>':'')+FOOT_SAVE(cur?'Save':'Add'),
   {nofocus:true,save:()=>{ if(!sites.length)return merr('Add A Pharmacy First.'); const kind=V('rk'), siteId=V('rs')||sites[0].id; let num=V('rn'), iso=V('ri'), neg=kind==='ante'&&VB('rneg'), nm, note='';
     if(kind==='nsa'){ nm=V('rnm'); if(!nm)return merr('Enter An Area Name.'); num=''; iso=''; neg=false; note=V('rnt'); }
     else { if(num&&!/^\d{1,2}$/.test(num))return merr('Room Number Must Be A Number, Like 1 Or 2.'); if(kind==='sca'){ iso=''; neg=false; } else { if(kind==='buffer'&&iso!=='7')return merr('A Buffer Room Must Be ISO 7.'); if(neg&&iso!=='7')return merr('An Ante Room Next To Or Shared With A Negative Pressure Room Must Be ISO 7.'); } nm=roomName(kind,num); }
     if(S.rooms.some(r=>!r.archived&&r.id!==id&&r.siteId===siteId&&r.name===nm))return merr(nm+' Already Exists. Use A Different '+(kind==='nsa'?'Name.':'Room Number.'));
     const r=Object.assign(cur||{id:uid('rm')},{kind,num,iso,neg,siteId,name:nm,note}); if(!cur)S.rooms.push(r); logAct(cur?'Edited Room':'Added Room',nm+(iso?', ISO '+iso:'')); closeModal(); changed('config'); return true; }});
  const sync=()=>{ const k=V('rk'), ante=k==='ante', neg=ante&&VB('rneg'), si=$('#f_ri'), pv=si.value||v.iso, ns=k==='nsa', sca=k==='sca'; $('#blkAnte').style.display=ante?'':'none'; $('#blkNs').style.display=ns?'':'none'; $('#blkNum').style.display=ns?'none':''; $('#blkIso').style.display=(ns||sca)?'none':'';
    si.innerHTML=ante?(neg?'<option value="7">ISO 7</option>':'<option value="8">ISO 8</option><option value="7">ISO 7</option>'):'<option value="7">ISO 7</option>'; if([...si.options].some(o=>o.value===pv))si.value=pv;
    $('#roomNote').textContent=ns?'USP <795> requires a designated, clean, organized and well-lit area. It has no ISO class and no certification schedule. Beyond-use dates come from the dosage-form table, per product.':sca?'An SCA is not ISO classified. It supports Category 1 preparations only, made in an ISO 5 PEC. Category 1 limit: 12 hours at room temperature or 24 hours refrigerated. Category 2 and 3 preparations need a cleanroom suite (ante room and buffer room).':ante?(neg?'An ante room next to or shared with a negative pressure room must be ISO 7.':'An ante room is ISO 8 or ISO 7. It must be ISO 7 if it is next to or shared with a negative pressure room.'):'A buffer room is ISO 7. It supports Category 1, 2 and 3 preparations.'; };
  $('#f_rk').addEventListener('change',sync); $('#f_rneg').addEventListener('change',sync); sync();
}
function pecModal(id){
  const cur=id?S.equipment.find(x=>x.id===id):null; const p0=(cur&&cur.pec)||{type:'lafw',flow:'h',ft:4}; const sites=S.sites.filter(s=>!s.archived);
  const std=[3,4,5,6].includes(+p0.ft); const siteId0=(cur&&cur.siteId)||(sites[0]&&sites[0].id)||'';
  const roomOpts=sid=>[['','Not Assigned To A Room']].concat(S.rooms.filter(r=>!r.archived&&(r.kind==='buffer'||r.kind==='sca')&&r.siteId===sid).map(r=>[r.id,r.name]));
  openModal(cur?'Edit PEC':'Add PEC','<p class="mut" style="margin:0 0 8px">Each PEC gets its own certification schedule and test list.</p>'+fld('Name',inp('pn',cur?cur.name:'','text','Example: Hood A'))+(sites.length>1?fld('Pharmacy',sel('ps',sites.map(s=>[s.id,s.name]),siteId0)):'')+
   fld('Room',sel('pr',roomOpts(siteId0),p0.roomId||''),'PECs Sit In A Buffer Room Or An SCA. Add The Room First If It Is Not Listed.')+'<div id="pecNote"></div>'+fld('PEC Type',sel('pt',Object.keys(PEC_TYPES).map(k=>[k,PEC_TYPES[k]]),p0.type))+
   '<div id="blkFlow">'+fld('Airflow Direction',sel('pf',[['h','Horizontal'],['v','Vertical']],p0.flow||'h'))+'</div><div id="blkBsc">'+fld('Cabinet Type',sel('pb',BSC_TYPES.map(x=>[x,x]),p0.bsc||BSC_TYPES[1]))+'</div>'+
   '<div id="blkLen"><div class="g2">'+fld('Length',sel('pl',[['3','3 ft'],['4','4 ft'],['5','5 ft'],['6','6 ft'],['x','Other: Enter Exact Feet']],std?String(+p0.ft):(p0.ft?'x':'4')))+'<div id="blkLenX">'+fld('Exact Length (Feet)',inp('plx',std?'':p0.ft,'number','Example: 4.5'))+'</div></div></div>'+
   '<div class="g2">'+fld('Brand',inp('pbr',p0.brand,'text'))+fld('Series Or Model',inp('pm',p0.model,'text'))+'</div>',
   (cur?'<button class="btn danger" data-act="archive" data-k="equip" data-id="'+esc(id)+'" style="margin-right:auto">Archive</button>':'')+FOOT_SAVE(cur?'Save':'Add'),
   {nofocus:true,save:()=>{ const name=V('pn'); if(!name)return merr('Enter A Name.'); if(!sites.length)return merr('Add A Pharmacy First.'); const type=V('pt'), siteId=V('ps')||sites[0].id;
     const pec={type,roomId:V('pr'),brand:V('pbr'),model:V('pm')}; if(type==='lafw')pec.flow=V('pf'); if(type==='bsc')pec.bsc=V('pb');
     if(type==='lafw'||type==='bsc'){ const l=V('pl'); if(l==='x'){ const x=+V('plx'); if(!(x>0&&x<=20))return merr('Enter The Exact Length In Feet.'); pec.ft=x; } else pec.ft=+l; }
     if(pec.roomId&&!S.rooms.some(r=>r.id===pec.roomId&&r.siteId===siteId))pec.roomId='';
     const e=cur||{id:uid('e'),kind:EQUIP_KINDS[0]}; Object.assign(e,{name,siteId,pec}); if(!cur)S.equipment.push(e); logAct(cur?'Edited PEC':'Added PEC',name+', '+PEC_TYPES[type]); closeModal(); changed('config'); return true; }});
  const sync=()=>{ const t=V('pt'); $('#blkFlow').style.display=t==='lafw'?'':'none'; $('#blkBsc').style.display=t==='bsc'?'':'none'; $('#blkLen').style.display=(t==='lafw'||t==='bsc')?'':'none'; $('#blkLenX').style.visibility=V('pl')==='x'?'visible':'hidden'; };
  const rooms=()=>{ const el=$('#f_pr'); if(!el)return; const pv=el.value; const sid=V('ps')||siteId0; el.innerHTML=roomOpts(sid).map(o=>'<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>').join(''); if([...el.options].some(o=>o.value===pv))el.value=pv; };
  const note=()=>{ const r=S.rooms.find(x=>x.id===V('pr')); $('#pecNote').innerHTML=r&&roomCats(r)?'<div class="banner info" style="margin:0 0 8px">'+esc(r.name)+': '+esc(roomCats(r))+'.</div>':''; };
  $('#f_pt').addEventListener('change',sync); $('#f_pl').addEventListener('change',sync); $('#f_pr').addEventListener('change',note); if($('#f_ps'))$('#f_ps').addEventListener('change',()=>{rooms();note();}); sync(); note();
}

/* ===== boot ===== */
(async function boot(){
  const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h))UI.tab=h;
  render();
  try{ await Store.init(); }catch(e){ Store.kind='memory'; }
  if(S.mode!=='live'){ if(BLANK){ S=emptyState(); S.mode='blank'; } else S=makeDemo(); }
  if(window.ILHOST&&ILHOST.user&&ILHOST.user.name&&!ME){ const nm=String(ILHOST.user.name).trim().toLowerCase(); const pp=S.people.find(x=>!x.archived&&String(x.name||'').trim().toLowerCase()===nm); if(pp)ME=pp.id; }
  UI.loading=false; if(!BLANK||S.mode==='live')recompute(); render();
  setInterval(()=>{ try{ if(!D)return; if(localToday()!==D.today){ recompute(); render(); } else updateClock(); }catch(e){} },1000);
})();

</script></body></html>
